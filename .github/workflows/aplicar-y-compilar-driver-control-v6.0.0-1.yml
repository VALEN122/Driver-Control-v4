      - name: Ejecutar pruebas automáticas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check xlsxwriter==3.2.9
          python -m py_compile main.py insight_engine.py excel_exporter.py
          python -m unittest discover -s tests -v

      - name: Guardar cambios en main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No hay cambios nuevos para guardar."
            exit 0
          fi
          git config user.name "Driver Control Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Driver Control 6.0.0: cierre inteligente"
          git push origin HEAD:main

      - name: Compilar APK de prueba
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug

      - name: Verificar y preparar APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find bin .buildozer -type f -name '*.apk' -print | sort | tail -1)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "No se encontró un APK válido."
            exit 1
          fi
          mkdir -p release
          cp "$APK_PATH" release/Driver-Control-v6.0.0-CIERRE-INTELIGENTE-debug.apk
          sha256sum release/Driver-Control-v6.0.0-CIERRE-INTELIGENTE-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v6.0.0-CIERRE-INTELIGENTE
          path: release/Driver-Control-v6.0.0-CIERRE-INTELIGENTE-debug.apk
          if-no-files-found: error
          retention-days: 14

