      - name: Guardar una copia del codigo actualizado
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-6.2.0-codigo-y-parche
          path: |
            ${{ runner.temp }}/Driver-Control-6.2.0-codigo.zip
            ${{ runner.temp }}/Driver-Control-6.2.0.patch
          if-no-files-found: error
          retention-days: 90
      - name: Comprobar calculos y funciones
        run: |
          python3 -m pip install xlsxwriter==3.2.9
          python3 -m unittest discover -s tests -v
          python3 -m py_compile main.py finance_core.py excel_exporter.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: kivy/python-for-android
          ref: ${{ env.P4A_COMMIT }}
          path: _toolchain/python-for-android
      - name: Preparar las herramientas de Android
        run: |
          test "$(git -C _toolchain/python-for-android rev-parse HEAD)" = "$P4A_COMMIT"
          git -C _toolchain/python-for-android apply --check "$GITHUB_WORKSPACE/patches/p4a-v2024.01.21-api36.patch"
          git -C _toolchain/python-for-android apply "$GITHUB_WORKSPACE/patches/p4a-v2024.01.21-api36.patch"
      - name: Recuperar la firma existente de la app
        env:
          DRIVER_CONTROL_DEBUG_KEYSTORE_B64: ${{ secrets.DRIVER_CONTROL_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DRIVER_CONTROL_DEBUG_KEYSTORE_B64:-}" ]; then
            echo '::error::Falta DRIVER_CONTROL_DEBUG_KEYSTORE_B64. Se requiere la firma existente para actualizar sin desinstalar.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DRIVER_CONTROL_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Compilar y verificar el APK 6.2.0
        run: bash scripts/android/build_ci.sh
      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-6.2.0-APK
          path: |
            bin/driver-control-*.apk
            bin/*-badging.txt
            bin/*-signature.txt
            bin/*-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Comprobar compatibilidad de 16 KiB para publicacion
        run: |
          set -euo pipefail
          APK=$(find bin -maxdepth 1 -name 'driver-control-*.apk' -print -quit)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" > bin/zipalign-16k.txt
          python3 scripts/android/check_elf_alignment.py "$APK" | tee bin/elf-alignment.txt
      - name: Guardar los resultados de las comprobaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-6.2.0-comprobaciones
          path: bin/*.txt
          if-no-files-found: warn
