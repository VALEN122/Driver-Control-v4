            echo "El proyecto cambió y el parche no puede aplicarse con seguridad."
            exit 1
          fi

      - name: Probar actualización v5.9.2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check xlsxwriter==3.2.9
          python -m py_compile main.py excel_exporter.py
          python -m unittest discover -s tests -v
          grep -F 'APP_VERSION = "5.9.2"' main.py
          grep -F 'version = 5.9.2' buildozer.spec
          grep -F 'MotionEvent.ACTION_MOVE' android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java
          grep -F 'intent.setClipData' main.py

      - name: Publicar código v5.9.2
        shell: bash
        run: |
          set -euo pipefail
          CHANGES=$(git status --porcelain -- CHANGELOG_5.9.2.md README.md buildozer.spec main.py android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java tests/test_finance_model.py tests/test_android_integration.py)
          if [ -n "$CHANGES" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG_5.9.2.md README.md buildozer.spec main.py android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java tests/test_finance_model.py tests/test_android_integration.py
            git commit -m "Improve Driver Control UI and Android sharing in 5.9.2"
            git push
          else
            echo "No hay cambios pendientes para publicar."
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK v5.9.2
        shell: bash
        run: |
          set -euxo pipefail

          cp buildozer.spec buildozer.spec.complete
          trap 'mv -f buildozer.spec.complete buildozer.spec 2>/dev/null || true' EXIT
          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec

          docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug
          sudo chown -R "$(id -u):$(id -g)" .buildozer bin || true

          MANIFEST_PATH=$(find .buildozer/android/platform -path '*/dists/drivercontrol/src/main/AndroidManifest.xml' -print -quit)
          test -n "$MANIFEST_PATH"
          DIST_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")

          if ! grep -q 'UberOfferAccessibilityService' "$MANIFEST_PATH"; then
            sed -i '/<\/application>/e cat android_manifest/application_services.xml' "$MANIFEST_PATH"
          fi

          JAVA_DST="$DIST_DIR/src/main/java/org/drivercontrol/drivercontrol"
          mkdir -p "$JAVA_DST"
          cp -v android_src/org/drivercontrol/drivercontrol/*.java "$JAVA_DST/"

          test -f "$JAVA_DST/DriverOverlayService.java"
          test -f "$JAVA_DST/UberOfferAccessibilityService.java"
          test -f "$JAVA_DST/OcrCaptureService.java"
          test -f "$JAVA_DST/DriverCopilotCoordinator.java"
          test -f "$JAVA_DST/TripProfitabilityAnalyzer.java"

          (cd "$DIST_DIR" && ./gradlew --version && ./gradlew clean assembleDebug)

          APK_PATH=$(find "$DIST_DIR/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          mkdir -p bin
          cp "$APK_PATH" bin/driver-control-v5.9.2-debug.apk

      - name: Subir APK v5.9.2
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5.9.2-APK
          path: bin/driver-control-v5.9.2-debug.apk
          if-no-files-found: error

