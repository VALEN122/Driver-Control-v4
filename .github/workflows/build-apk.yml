name: Build Driver Control v5.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          cp buildozer.spec buildozer.spec.complete
          trap 'mv -f buildozer.spec.complete buildozer.spec 2>/dev/null || true' EXIT

          # python-for-android no inserta correctamente bloques <service> mediante
          # android.extra_manifest_application_arguments. Compilamos primero el proyecto
          # Android y luego inyectamos los servicios en el Manifest generado.
          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec
          docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug

          # Los archivos creados por Docker pueden quedar como root. Los pasamos al runner
          # para que Gradle se ejecute SIN sudo y conserve JAVA_HOME de JDK 17.
          sudo chown -R "$(id -u):$(id -g)" .buildozer bin || true

          MANIFEST_PATH=$(find .buildozer/android/platform -path '*/dists/drivercontrol/src/main/AndroidManifest.xml' -print -quit)
          test -n "$MANIFEST_PATH"
          DIST_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")

          # Inyectar una sola vez AccessibilityService + OCR service.
          if ! grep -q 'UberOfferAccessibilityService' "$MANIFEST_PATH"; then
            sed -i '/<\/application>/e cat android_manifest/application_services.xml' "$MANIFEST_PATH"
          fi

                    # Copiar explícitamente los servicios Android al proyecto generado.
          JAVA_DST="$DIST_DIR/src/main/java/org/drivercontrol/drivercontrol"
          mkdir -p "$JAVA_DST"

          cp -v android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java "$JAVA_DST/"

          # Verificar que realmente quedaron dentro del proyecto Android.
          test -f "$JAVA_DST/DriverOverlayService.java"
          test -f "$JAVA_DST/UberOfferAccessibilityService.java"
          test -f "$JAVA_DST/OcrCaptureService.java"

          echo "=== Servicios Android copiados correctamente ==="
          ls -la "$JAVA_DST"

          # Confirmar que el segundo build realmente usa Java 17.
          java -version
          (cd "$DIST_DIR" && ./gradlew --version && ./gradlew clean assembleDebug)

          APK_PATH=$(find "$DIST_DIR/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          mkdir -p bin
          cp "$APK_PATH" bin/driver-control-v5.1.0-debug.apk

      - name: Upload Driver Control v5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5.1.0-UberFilter-OCR-APK
          path: bin/driver-control-v5.1.0-debug.apk
          if-no-files-found: error
