          PATCH_BASE64

          if git apply --check /tmp/driver-control-v5.9.0.patch; then
            git apply --index /tmp/driver-control-v5.9.0.patch
          elif git apply --reverse --check /tmp/driver-control-v5.9.0.patch; then
            echo "La actualización v5.9.0 ya estaba aplicada."
          else
            echo "El proyecto cambió y el parche no se puede aplicar de forma segura."
            exit 1
          fi

      - name: Probar versión v5.9.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check xlsxwriter==3.2.9
          python -m py_compile main.py excel_exporter.py tests/*.py
          python -m unittest discover -s tests -v
          node --check server.mjs
          grep -F 'APP_VERSION = "5.9.0"' main.py
          grep -F 'version = 5.9.0' buildozer.spec

      - name: Publicar versión v5.9.0
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para publicar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Redesign Driver Control 5.9.0"
            git push origin HEAD:main
          fi

      - name: Iniciar compilación del APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3 4 5; do
            if gh workflow run build-apk.yml --ref main; then
              echo "Compilación de Driver Control 5.9.0 iniciada."
              exit 0
            fi
            sleep 5
          done
          echo "No se pudo iniciar la compilación."
          exit 1
