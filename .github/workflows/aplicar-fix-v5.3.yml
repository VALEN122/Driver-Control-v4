name: Aplicar fix Driver Control v5.3 lector visual y compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aplicar lector visual v5.3
        shell: bash
        env:
          B64_ACCESSIBILITY: 
          B64_ACCESSIBILITY_XML: 
        run: |
          set -euxo pipefail

          python3 - <<'PYFIX'
          import base64
          import os
          from pathlib import Path

          def write_b64(path, env_name):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(os.environ[env_name]))

          write_b64(
              "android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java",
              "B64_ACCESSIBILITY",
          )
          write_b64(
              "android_res/xml/uber_offer_accessibility_service.xml",
              "B64_ACCESSIBILITY_XML",
          )

          main_path = Path("main.py")
          main = main_path.read_text(encoding="utf-8")
          main = main.replace('APP_VERSION = "5.2.0"', 'APP_VERSION = "5.3.0"')
          main = main.replace('APP_VERSION = "5.1.0"', 'APP_VERSION = "5.3.0"')
          main = main.replace(
              "LECTURA RÁPIDA (ACCESIBILIDAD)",
              "LECTURA VISUAL AUTOMÁTICA",
          )
          main = main.replace(
              "Accesibilidad se usa solo para leer tarifa, minutos y kilómetros visibles en Uber. "
              "No pulsa botones ni acepta viajes. La lectura está limitada para cuidar el rendimiento. "
              "Si Uber no expone texto accesible, activá OCR como respaldo. "
              "Mantené pulsada la burbuja $ para ver el último diagnóstico del lector.",
              "El lector visual usa Accesibilidad únicamente para detectar Uber y tomar capturas locales "
              "de la pantalla. El OCR se procesa en el teléfono; no pulsa botones ni acepta viajes. "
              "Esta versión evita recorrer árboles grandes de Accesibilidad para cuidar el rendimiento. "
              "Mantené pulsada la burbuja $ para ver el último diagnóstico.",
          )
          main_path.write_text(main, encoding="utf-8")

          spec = Path("buildozer.spec")
          spec_text = spec.read_text(encoding="utf-8")
          spec_text = spec_text.replace("version = 5.2.0", "version = 5.3.0")
          spec_text = spec_text.replace("version = 5.1.0", "version = 5.3.0")
          spec.write_text(spec_text, encoding="utf-8")

          Path("CHANGELOG_5.3.0.md").write_text(
              "# Driver Control 5.3.0 — lector visual de Uber\n\n"
              "- Cambia la estrategia de lectura en Android 11+: ya no depende del texto accesible de la tarjeta.\n"
              "- Usa AccessibilityService.takeScreenshot() + ML Kit OCR local.\n"
              "- Evita recorrer ventanas y cientos de nodos en Android moderno para reducir tirones.\n"
              "- Mantiene un fallback acotado para Android antiguo.\n"
              "- No guarda capturas, no transmite imágenes y nunca pulsa Aceptar/Rechazar.\n"
              "- El parser y el flotante siguen siendo los de v5.2.\n",
              encoding="utf-8",
          )
          PYFIX

          python3 -m py_compile main.py
          grep -q 'APP_VERSION = "5.3.0"' main.py
          grep -q 'takeScreenshot' android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java
          grep -q 'canTakeScreenshot="true"' android_res/xml/uber_offer_accessibility_service.xml
          grep -q 'com.google.mlkit:.*text-recognition' buildozer.spec
          git diff --check

      - name: Compilar APK Android v5.3
        shell: bash
        run: |
          set -euxo pipefail

          cp buildozer.spec buildozer.spec.complete
          trap 'mv -f buildozer.spec.complete buildozer.spec 2>/dev/null || true' EXIT

          # Evita que p4a intente inyectar dos veces los servicios.
          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec

          docker run --rm             -v "$PWD":/home/user/hostcwd             ghcr.io/kivy/buildozer:latest android debug

          sudo chown -R "$(id -u):$(id -g)" .buildozer bin || true

          MANIFEST_PATH=$(find .buildozer/android/platform             -path '*/dists/drivercontrol/src/main/AndroidManifest.xml'             -print -quit)
          test -n "$MANIFEST_PATH"

          DIST_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")

          if ! grep -q 'UberOfferAccessibilityService' "$MANIFEST_PATH"; then
            sed -i '/<\/application>/e cat android_manifest/application_services.xml' "$MANIFEST_PATH"
          fi

          JAVA_DST="$DIST_DIR/src/main/java/org/drivercontrol/drivercontrol"
          mkdir -p "$JAVA_DST"

          cp -v android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java "$JAVA_DST/"

          (cd "$DIST_DIR" && ./gradlew clean assembleDebug)

          APK_PATH=$(find "$DIST_DIR/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK_PATH"

          mkdir -p release
          cp "$APK_PATH" release/Driver-Control-v5.3.0-LECTOR-VISUAL.apk

      - name: Subir APK v5.3
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5.3.0-LECTOR-VISUAL
          path: release/Driver-Control-v5.3.0-LECTOR-VISUAL.apk
          if-no-files-found: error

      - name: Guardar código v5.3 en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             main.py             buildozer.spec             CHANGELOG_5.3.0.md             android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java             android_res/xml/uber_offer_accessibility_service.xml

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Driver Control v5.3: lector visual Uber [skip ci]"
            git push origin HEAD:main
          fi
