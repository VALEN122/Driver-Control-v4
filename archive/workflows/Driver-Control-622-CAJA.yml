              raise SystemExit('La actualizacion esta incompleta o fue modificada')
          path = Path(os.environ['RUNNER_TEMP']) / 'Driver-Control-6.2.2.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if actual != '53f97686fcde92ddbc2c5c60e1cc2910891f9412':
              raise SystemExit('El codigo preparado no coincide con la version revisada')
          archive = Path(os.environ['RUNNER_TEMP']) / 'Driver-Control-6.2.2-codigo.zip'
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
              for name in names:
                  if name:
                      output.write(name, 'Driver-Control-6.2.2/' + name)
          print('Actualizacion 6.2.2 preparada. Codigo y parche conservados como artefactos.')
