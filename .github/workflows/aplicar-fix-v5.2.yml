name: Aplicar fix Driver Control v5.2 y compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aplicar correcciones v5.2
        shell: bash
        env:
          B64_OVERLAY: 
          B64_ACCESSIBILITY: 
          B64_OCR: 
          B64_ACCESSIBILITY_XML: 
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          import base64, os

          def write_b64(path, env_name):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(os.environ[env_name]))

          write_b64("android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java", "B64_OVERLAY")
          write_b64("android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java", "B64_ACCESSIBILITY")
          write_b64("android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java", "B64_OCR")
          write_b64("android_res/xml/uber_offer_accessibility_service.xml", "B64_ACCESSIBILITY_XML")

          main_path = Path("main.py")
          main = main_path.read_text(encoding="utf-8")
          main = main.replace('APP_VERSION = "5.1.0"', 'APP_VERSION = "5.2.0"')

          def replace_function(source, start_marker, end_marker, replacement):
              start = source.find(start_marker)
              end = source.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise RuntimeError(f"No se encontró bloque: {start_marker} -> {end_marker}")
              return source[:start] + replacement + source[end:]

          request_func = '    def request_uber_accessibility(self):\n        """Abre la autorización de Accesibilidad con botones visibles y comportamiento estable."""\n        if platform != "android":\n            self.show_message("Solo Android", "La lectura por accesibilidad funciona únicamente en Android.")\n            return\n\n        disclosure = (\n            "Accesibilidad se usa solo para leer tarifa, minutos y kilómetros visibles en Uber. "\n            "No pulsa botones ni acepta viajes. La lectura está limitada para cuidar el rendimiento. "\n            "Si Uber no expone texto accesible, activá OCR como respaldo. "\n            "Mantené pulsada la burbuja $ para ver el último diagnóstico del lector."\n        )\n        dialog = None\n\n        def cancel(_button):\n            if dialog is not None:\n                dialog.dismiss()\n\n        def continue_to_settings(_button):\n            if dialog is not None:\n                dialog.dismiss()\n            self._sync_android_assistant_settings()\n            self._start_driver_overlay_service()\n            try:\n                from jnius import autoclass\n                Intent = autoclass("android.content.Intent")\n                Settings = autoclass("android.provider.Settings")\n                PythonActivity = autoclass("org.kivy.android.PythonActivity")\n                current = PythonActivity.mActivity\n                current.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))\n            except Exception:\n                LOGGER.exception("Could not open Android accessibility settings")\n                self.show_message("Permiso", "No se pudieron abrir los ajustes de accesibilidad.")\n\n        # Los botones se crean junto con el MDDialog. En algunos Samsung/KivyMD,\n        # asignar dialog.buttons después de construirlo deja el área de acciones vacía.\n        dialog = MDDialog(\n            title="Lectura rápida",\n            text=disclosure,\n            buttons=[\n                MDFlatButton(text="CANCELAR", on_release=cancel),\n                MDFlatButton(text="CONTINUAR", on_release=continue_to_settings),\n            ],\n        )\n        dialog.open()\n\n'
          result_func = '    def _show_assistant_result_dialog(self, result):\n        dialog = None\n\n        def mark(decision):\n            self.save_trip_assessment(decision)\n            if dialog is not None:\n                dialog.dismiss()\n\n        def close(_button):\n            if dialog is not None:\n                dialog.dismiss()\n\n        dialog = MDDialog(\n            title=f"{result[\'recommendation\']} · {result[\'score\']:.0f}/100",\n            text="\\n".join([\n                f"Tarifa: {self.money(result[\'fare\'])}",\n                f"Tiempo total: {result[\'total_min\']:.0f} min",\n                f"Distancia total: {result[\'total_km\']:.1f} km",\n                f"Costo nafta: {self.money(result[\'fuel_cost\'])}",\n                f"Ganancia neta est.: {self.money(result[\'net_est\'])}",\n                f"$/hora: {self.money(result[\'hourly_est\'])}/h",\n                f"$/km: {self.money(result[\'per_km_est\'])}/km",\n                "",\n                "Por qué: " + " · ".join(result[\'reasons\'][:4]),\n            ]),\n            buttons=[\n                MDFlatButton(text="RECHACÉ", on_release=lambda _x: mark("REJECTED")),\n                MDFlatButton(text="CERRAR", on_release=close),\n                MDFlatButton(text="ACEPTÉ", on_release=lambda _x: mark("ACCEPTED")),\n            ],\n        )\n        dialog.open()\n\n'
          main = replace_function(
              main,
              "    def request_uber_accessibility(self):",
              "    def request_uber_ocr(self):",
              request_func,
          )
          main = replace_function(
              main,
              "    def _show_assistant_result_dialog(self, result):",
              "    def save_trip_assessment(self, decision: str):",
              result_func,
          )
          main = main.replace(
              "El flotante y el vuelto funcionan sin depender de Accesibilidad. Para leer ofertas podés usar Accesibilidad (rápida) u OCR (respaldo).",
              "El flotante y el vuelto son independientes. Usá Accesibilidad para lectura rápida u OCR si Uber no expone texto. Mantené pulsada la burbuja $ para diagnóstico.",
          )
          main_path.write_text(main, encoding="utf-8")

          spec = Path("buildozer.spec")
          text = spec.read_text(encoding="utf-8")
          text = text.replace("version = 5.1.0", "version = 5.2.0")
          spec.write_text(text, encoding="utf-8")

          Path("CHANGELOG_5.2.0.md").write_text('# Driver Control 5.2.0 — lectura de Uber estabilizada\n\n- Corrige los diálogos de KivyMD que aparecían sin botones en algunos Samsung.\n- Reestructura el lector de Accesibilidad con límites de nodos/frecuencia para evitar tirones.\n- Agrega fallback de root activo + ventanas interactivas y lectura de texto/descripción/hint.\n- Hace el parser tolerante a coma/punto, saltos de línea, `min ... km`, `km ... min` y errores OCR comunes.\n- Elimina el recorte OCR fijo del 28% que podía ocultar la tarifa; ahora conserva casi toda la pantalla y reduce resolución si hace falta.\n- Evita que OCR vuelva a analizar el propio flotante de Driver Control.\n- Agrega diagnóstico visible: mantené pulsada la burbuja `$` para ver el último estado del lector.\n- El flotante nunca pulsa Aceptar/Rechazar: la decisión sigue siendo del conductor.\n', encoding="utf-8")
          PYFIX

          python3 -m py_compile main.py
          grep -q 'APP_VERSION = "5.2.0"' main.py
          grep -q 'buttons=\[' main.py
          grep -q 'class OfferParser' android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java
          grep -q 'ACTION_READER_STATUS' android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java
          grep -q 'cropTop = Math.max(0, Math.round(height \* 0.08f))' android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java
          git diff --check

      - name: Compilar APK Android v5.2
        shell: bash
        run: |
          set -euxo pipefail
          cp buildozer.spec buildozer.spec.complete
          trap 'mv -f buildozer.spec.complete buildozer.spec 2>/dev/null || true' EXIT

          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec
          docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug

          sudo chown -R "$(id -u):$(id -g)" .buildozer bin || true
          MANIFEST_PATH=$(find .buildozer/android/platform -path '*/dists/drivercontrol/src/main/AndroidManifest.xml' -print -quit)
          test -n "$MANIFEST_PATH"
          DIST_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")

          if ! grep -q 'UberOfferAccessibilityService' "$MANIFEST_PATH"; then
            sed -i '/<\/application>/e cat android_manifest/application_services.xml' "$MANIFEST_PATH"
          fi

          JAVA_DST="$DIST_DIR/src/main/java/org/drivercontrol/drivercontrol"
          mkdir -p "$JAVA_DST"
          cp -v android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java "$JAVA_DST/"
          cp -v android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java "$JAVA_DST/"

          test -f "$JAVA_DST/DriverOverlayService.java"
          test -f "$JAVA_DST/UberOfferAccessibilityService.java"
          test -f "$JAVA_DST/OcrCaptureService.java"

          java -version
          (cd "$DIST_DIR" && ./gradlew --version && ./gradlew clean assembleDebug)

          APK_PATH=$(find "$DIST_DIR/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          mkdir -p release
          cp "$APK_PATH" release/Driver-Control-v5.2.0-CORREGIDO.apk

      - name: Subir APK corregido
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5.2.0-CORREGIDO
          path: release/Driver-Control-v5.2.0-CORREGIDO.apk
          if-no-files-found: error

      - name: Guardar código corregido en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py buildozer.spec CHANGELOG_5.2.0.md             android_src/org/drivercontrol/drivercontrol/DriverOverlayService.java             android_src/org/drivercontrol/drivercontrol/UberOfferAccessibilityService.java             android_src/org/drivercontrol/drivercontrol/OcrCaptureService.java             android_res/xml/uber_offer_accessibility_service.xml
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Driver Control v5.2: fix lectura Uber y diálogos [skip ci]"
            git push origin HEAD:main
          fi
