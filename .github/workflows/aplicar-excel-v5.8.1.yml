      - name: Probar exportación a Excel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check xlsxwriter==3.2.9
          PYTHONPATH=. python tests/test_excel_exporter.py
          python -m py_compile main.py excel_exporter.py tests/test_excel_exporter.py

      - name: Publicar versión 5.8.1
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para publicar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Export all Driver Control data to Excel"
            git push origin HEAD:main
          fi

      - name: Iniciar compilación del APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3 4 5; do
            if gh workflow run build-apk.yml --ref main; then
              echo "Compilación de Driver Control 5.8.1 iniciada."
              exit 0
            fi
            sleep 5
          done
          echo "No se pudo iniciar la compilación."
          exit 1

