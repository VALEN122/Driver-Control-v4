            git apply /tmp/driver-control-v5.9.1.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG_5.9.1.md README.md buildozer.spec main.py tests/test_finance_model.py
