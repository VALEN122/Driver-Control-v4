      - name: Ejecutar pruebas automáticas
        run: |
          python -m pip install --disable-pip-version-check xlsxwriter==3.2.9
          python -m py_compile main.py insight_engine.py excel_exporter.py
          python -m unittest discover -s tests -v
          grep -q 'APP_VERSION = "6.1.0"' main.py
          grep -q 'DINERO REAL QUE TE QUEDÓ' main.py
          grep -q 'version = 6.1.0' buildozer.spec

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar firma persistente de prueba
        shell: bash
        env:
          DRIVER_CONTROL_DEBUG_KEYSTORE_B64: ${{ secrets.DRIVER_CONTROL_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${DRIVER_CONTROL_DEBUG_KEYSTORE_B64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$DRIVER_CONTROL_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Compilar APK v6.1.0
        shell: bash
        run: |
          set -euo pipefail

          cp buildozer.spec buildozer.spec.complete
          trap 'mv -f buildozer.spec.complete buildozer.spec 2>/dev/null || true' EXIT
          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec

          docker run --rm             -v "$PWD":/home/user/hostcwd             -v "$HOME/.android/debug.keystore":/home/user/.android/debug.keystore             ghcr.io/kivy/buildozer:latest android debug

          sudo chown -R "$(id -u):$(id -g)" .buildozer bin || true

          MANIFEST_PATH=$(find .buildozer/android/platform -path '*/dists/drivercontrol/src/main/AndroidManifest.xml' -print -quit)
          test -n "$MANIFEST_PATH"
          DIST_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")

          if ! grep -q 'UberOfferAccessibilityService' "$MANIFEST_PATH"; then
            sed -i '/<\/application>/e cat android_manifest/application_services.xml' "$MANIFEST_PATH"
          fi

          JAVA_DST="$DIST_DIR/src/main/java/org/drivercontrol/drivercontrol"
          mkdir -p "$JAVA_DST"
          cp -v android_src/org/drivercontrol/drivercontrol/*.java "$JAVA_DST/"
          test -f "$JAVA_DST/DriverOverlayService.java"
          test -f "$JAVA_DST/UberOfferAccessibilityService.java"
          test -f "$JAVA_DST/OcrCaptureService.java"
          test -f "$JAVA_DST/DriverCopilotCoordinator.java"
          test -f "$JAVA_DST/TripProfitabilityAnalyzer.java"

          (cd "$DIST_DIR" && ./gradlew --version && ./gradlew clean assembleDebug)

          APK_PATH=$(find "$DIST_DIR/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          mkdir -p bin
          cp "$APK_PATH" bin/driver-control-v6.1.0-frontend-10x.apk

          unzip -t bin/driver-control-v6.1.0-frontend-10x.apk >/dev/null
          test "$(stat -c%s bin/driver-control-v6.1.0-frontend-10x.apk)" -gt 10000000
          unzip -p bin/driver-control-v6.1.0-frontend-10x.apk assets/private.tar > /tmp/private.tar
          MAIN_PYC=$(tar -tf /tmp/private.tar | grep -E '(^|/)main\.pyc$' | head -n1)
          test -n "$MAIN_PYC"
          tar -xOf /tmp/private.tar "$MAIN_PYC" | strings | grep -q '6.1.0'
          tar -xOf /tmp/private.tar "$MAIN_PYC" | strings | grep -q 'DINERO REAL QUE TE QUEDÓ'

      - name: Publicar código verificado en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             main.py insight_engine.py excel_exporter.py buildozer.spec             tests CHANGELOG_6.1.0.md             android_src android_res android_manifest             ".github/workflows/build-apk.yml"             ".github/workflows/build-apk (1).yml"
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para publicar."
          else
            git commit -m "Publicar Driver Control v6.1.0 frontend 10X"
            git push origin HEAD:main
          fi

      - name: Subir APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v6.1.0-FRONTEND-10X
          path: bin/driver-control-v6.1.0-frontend-10x.apk
          if-no-files-found: error
          retention-days: 30
