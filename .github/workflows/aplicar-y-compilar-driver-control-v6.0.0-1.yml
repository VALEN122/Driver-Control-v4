name: Aplicar y compilar Driver Control v6.0.0

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/*v6.0.0*.yml"

permissions:
  contents: write

concurrency:
  group: driver-control-v6.0.0
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar Driver Control v6.0.0
