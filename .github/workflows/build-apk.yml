name: Build Driver Control v5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          java -version
          cp buildozer.spec buildozer.spec.complete

          sed -i '/^android.extra_manifest_application_arguments[[:space:]]*=/d' buildozer.spec

          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

          mv buildozer.spec.complete buildozer.spec

          APK_PATH=$(find bin -type f -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No se genero ningun APK"
            exit 1
          fi

          echo "APK generado: $APK_PATH"

      - name: Upload Driver Control APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5-APK
          path: bin/*.apk
          if-no-files-found: error
