name: Build Driver Control v5 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        run: docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug

      - name: Upload Driver Control v5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Control-v5.0-UberFilter-OCR-APK
          path: bin/*.apk
          if-no-files-found: error
